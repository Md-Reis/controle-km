<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="var(--card)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cotação</title>
<link rel="stylesheet" href="./style.css">
<style>
  /* ── Tipo de viagem ── */
  .tipo-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .tipo-btn {
    padding: 14px 10px;
    border-radius: 14px;
    border: 2px solid rgba(199,183,255,.1);
    background: var(--bg);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all .2s ease;
    line-height: 1.4;
  }
  .tipo-btn span { display:block; font-size:24px; margin-bottom:4px; }
  .tipo-btn.active {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(199,183,255,.06);
    box-shadow: 0 0 20px rgba(124,106,230,.2);
  }

  /* ── Resultado único ── */
  .result-unica {
    background: linear-gradient(135deg, var(--card), var(--bg2));
    border: 1px solid rgba(199,183,255,.15);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    margin-top: 12px;
  }
  .result-unica .valor-grande {
    font-size: 42px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
    margin: 8px 0;
    letter-spacing: -1px;
  }
  .result-unica .custo-info {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }
  .result-unica .lucro-info {
    font-size: 15px;
    font-weight: 600;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.06);
  }

  /* ── Tabela constante ── */
  .tabela-constante {
    margin-top: 12px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(199,183,255,.08);
  }
  .tabela-header {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr;
    background: rgba(124,106,230,.15);
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .tabela-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr;
    padding: 11px 14px;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,.04);
    align-items: center;
    transition: background .15s;
  }
  .tabela-row:last-child { border-bottom: none; }
  .tabela-row:nth-child(even) { background: rgba(255,255,255,.02); }
  .tabela-row:hover { background: rgba(124,106,230,.07); }
  .tabela-row .col-qtd {
    font-weight: 700;
    color: var(--text);
  }
  .tabela-row .col-valor {
    font-weight: 700;
    color: var(--primary);
  }
  .tabela-row .col-desc {
    font-size: 12px;
    color: #22c55e;
    font-weight: 600;
  }
  .tabela-row .col-total {
    font-weight: 700;
    color: var(--accent);
  }

  /* ── Destino WhatsApp ── */
  .wpp-section {
    margin-top: 16px;
  }
  .wpp-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .wpp-toggle button {
    flex: 1;
    padding: 9px;
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--muted);
    font-size: 13px;
    width: auto;
    border: 1px solid rgba(199,183,255,.08);
    transition: all .2s;
  }
  .wpp-toggle button.active {
    background: #25d366;
    color: #fff;
    border-color: #25d366;
  }
  .btn-wpp {
    background: #25d366 !important;
    color: #fff !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    margin-top: 10px;
    border-radius: 14px !important;
    padding: 16px !important;
    letter-spacing: .3px;
    box-shadow: 0 4px 20px rgba(37,211,102,.3);
  }
  .btn-wpp:active { transform: scale(0.98); }

  /* ── Veículo banner ── */
  .veiculo-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(124,106,230,.08);
    border: 1px solid rgba(124,106,230,.2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .veiculo-banner .icon { font-size: 24px; }
  .veiculo-banner .info { flex:1; }
  .veiculo-banner .nome { font-weight: 700; font-size: 15px; }
  .veiculo-banner .custo { font-size: 12px; color: var(--secondary); margin-top: 2px; }

  /* ── Margem slider ── */
  .margem-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .margem-row input[type=range] {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(199,183,255,.15);
    outline: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    accent-color: var(--primary);
  }
  .margem-badge {
    min-width: 48px;
    text-align: center;
    font-weight: 700;
    color: var(--primary);
    font-size: 15px;
  }

  /* ── Desconto badge ── */
  .desc-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .desc-row input[type=range] {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(199,183,255,.15);
    outline: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    accent-color: #22c55e;
  }
  .desc-badge {
    min-width: 48px;
    text-align: center;
    font-weight: 700;
    color: #22c55e;
    font-size: 15px;
  }

  .hidden { display: none !important; }

  /* ── Animação entrada ── */
  @keyframes slideUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .anim-in { animation: slideUp .3s ease forwards; }
</style>
</head>
<body>

<nav>
  <button onclick="window.location.href='index.html'" >← Início</button>
  <span style="margin-top:10px; flex:1;text-align:center;font-weight:700;font-size:16px;color:var(--primary)">💰 Cotação</span>
</nav>

<!-- ── Veículo ativo ── -->
<div id="veiculoBanner" class="veiculo-banner">
  <div class="icon">🚗</div>
  <div class="info">
    <div class="nome" id="bNome">—</div>
    <div class="custo" id="bCusto">Configure um veículo no Início</div>
  </div>
</div>

<!-- ── Tipo de viagem ── -->
<div class="tipo-selector">
  <div class="tipo-btn active" id="btnUnica" onclick="setTipo('unica')">
    <span>🎯</span>Viagem Única
  </div>
  <div class="tipo-btn" id="btnConstante" onclick="setTipo('constante')">
    <span>🔄</span>Viagem Constante
  </div>
</div>

<!-- ── Formulário ── -->
<div class="card">
  <label>KM a percorrer</label>
  <input id="kmInput" type="number" placeholder="Ex: 25" oninput="calcular()">

  <!-- Margem de lucro -->
  <label style="margin-top:12px">Margem de lucro</label>
  <div class="margem-row">
    <input type="range" id="margemSlider" min="0" max="200" value="50" oninput="atualizarMargem()">
    <div class="margem-badge" id="margemBadge">50%</div>
  </div>
  <small style="color:var(--muted)">Valor cobrado = custo × (1 + margem)</small>

  <!-- Mão de obra -->
  <div style="margin-top:12px">
    <label>🧑‍🔧 Mão de obra</label>
    <div class="margem-row">
      <input type="range" id="maoObraSlider" min="0" max="100" value="10" step="1" oninput="atualizarMaoObra()">
      <div class="margem-badge" id="maoObraBadge" style="color:var(--secondary)">10%</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
      <small style="color:var(--muted)">Percentual sobre o valor da corrida</small>
      <small id="maoObraValor" style="color:var(--secondary);font-weight:600"></small>
    </div>
  </div>

  <!-- Desconto por viagem (só constante) -->
  <div id="descontoWrap" class="hidden" style="margin-top:12px">
    <label>Desconto por viagem adicional</label>
    <div class="desc-row">
      <input type="range" id="descontoSlider" min="1" max="20" value="5" oninput="atualizarDesconto()">
      <div class="desc-badge" id="descontoBadge">5%</div>
    </div>
    <small style="color:var(--muted)">Cada viagem adicional ganha este desconto cumulativo</small>

    <label style="margin-top:12px">Número máximo de viagens no orçamento</label>
    <input id="maxViagens" type="number" placeholder="Ex: 5" min="2" max="30" value="5" oninput="calcular()">
  </div>
</div>

<!-- ── Resultado Única ── -->
<div id="resultUnica" class="hidden anim-in">
  <div class="result-unica">
    <div style="font-size:13px;color:var(--muted)">💵 Valor sugerido</div>
    <div class="valor-grande" id="valorUnico">R$ —</div>
    <div class="custo-info" id="custoUnico"></div>
    <div class="lucro-info" id="lucroUnico"></div>
  </div>
</div>

<!-- ── Resultado Constante ── -->
<div id="resultConstante" class="hidden anim-in">
  <div class="tabela-constante" id="tabelaConstante"></div>
</div>

<!-- ── Enviar WhatsApp ── -->
<div id="wppSection" class="wpp-section hidden">
  <div class="card">
    <label>📲 Enviar orçamento por WhatsApp</label>

    <div class="wpp-toggle">
      <button id="btnClienteCad" class="active" onclick="setDestinatario('cadastrado')">👥 Cliente cadastrado</button>
      <button id="btnNumAvulso" onclick="setDestinatario('avulso')">📱 Número avulso</button>
    </div>

    <!-- Cliente cadastrado -->
    <div id="wrapClienteCad">
      <select id="selectCliente" style="width:100%;padding:10px;border-radius:10px;border:none;background:var(--input-bg);color:var(--text);margin-bottom:8px">
        <option value="">— Selecione um cliente —</option>
      </select>
    </div>

    <!-- Número avulso -->
    <div id="wrapNumAvulso" class="hidden">
      <input id="numAvulso" type="tel" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15" oninput="mascaraTel(this)">
    </div>

    <button class="btn-wpp" onclick="enviarWhatsApp()">
      📤 Enviar pelo WhatsApp
    </button>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--input-bg);color:white;padding:14px 18px;border-radius:12px;
  display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9999;font-weight:500;
"></div>

<script>
// ── Storage ──
const data   = JSON.parse(localStorage.getItem('kmApp'))    || { veiculos:[], ativo:null };
const vData  = JSON.parse(localStorage.getItem('viagensApp')) || { clientes:[] };

let tipoViagem   = 'unica';      // 'unica' | 'constante'
let destinatario = 'cadastrado'; // 'cadastrado' | 'avulso'

// ── Funções utilitárias ──
function formatCurrency(v) {
  return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  const c = {success:'#22c55e',error:'#ef4444',info:'#38bdf8'};
  t.innerText = msg;
  t.style.borderLeft = `6px solid ${c[type]||c.success}`;
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 2500);
}
function mascaraTel(input) {
  let v = input.value.replace(/\D/g,'');
  if (v.length<=10) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');
  else              v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
  input.value = v;
}

// ── Veículo ──
function getAtivo() { return data.veiculos.find(v=>v.id===data.ativo); }
function calcularCustoPorKm(v) {
  if (!v||v.consumo<=0) return 0;
  const cComb    = v.custos.comb / v.consumo;
  const fixo     = (v.custos.man||0)+(v.custos.pneu||0)+(v.custos.seg||0)+(v.custos.out||0);
  const kmMensal = Number(v.kmMensal) || 2000;
  return cComb + fixo / kmMensal;
}

function initBanner() {
  const v = getAtivo();
  if (!v) return;
  document.getElementById('bNome').innerText  = v.nome;
  const cKm = calcularCustoPorKm(v);
  document.getElementById('bCusto').innerText = cKm>0
    ? `Custo por km: R$ ${cKm.toFixed(3)}`
    : 'Configure os custos no Início';
}

// ── Clientes ──
function popularClientes() {
  const sel = document.getElementById('selectCliente');
  sel.innerHTML = '<option value="">— Selecione um cliente —</option>';
  (vData.clientes||[]).forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.nome;
    sel.appendChild(opt);
  });
}

// ── Tipo ──
function setTipo(tipo) {
  tipoViagem = tipo;
  document.getElementById('btnUnica').classList.toggle('active', tipo==='unica');
  document.getElementById('btnConstante').classList.toggle('active', tipo==='constante');
  document.getElementById('descontoWrap').classList.toggle('hidden', tipo==='unica');
  document.getElementById('resultUnica').classList.add('hidden');
  document.getElementById('resultConstante').classList.add('hidden');
  document.getElementById('wppSection').classList.add('hidden');
  calcular();
}

function atualizarMargem() {
  const v = document.getElementById('margemSlider').value;
  document.getElementById('margemBadge').innerText = v+'%';
  calcular();
}
function atualizarDesconto() {
  const v = document.getElementById('descontoSlider').value;
  document.getElementById('descontoBadge').innerText = v+'%';
  calcular();
}
function atualizarMaoObra() {
  const v = document.getElementById('maoObraSlider').value;
  document.getElementById('maoObraBadge').innerText = v+'%';
  calcular();
}

// ── Cálculo principal ──
function calcular() {
  const veiculo = getAtivo();
  const km      = Number(document.getElementById('kmInput').value);
  if (!veiculo || !km || km<=0) {
    document.getElementById('resultUnica').classList.add('hidden');
    document.getElementById('resultConstante').classList.add('hidden');
    document.getElementById('wppSection').classList.add('hidden');
    return;
  }

  const custoKm    = calcularCustoPorKm(veiculo);
  const custoTotal = km * custoKm;
  const margem     = Number(document.getElementById('margemSlider').value) / 100;
  const maoObra    = Number(document.getElementById('maoObraSlider').value) / 100;
  const valorBase  = custoTotal * (1 + margem + maoObra);

  // Atualiza valor da mão de obra em R$
  const maoObraReais = custoTotal * maoObra;
  const moEl = document.getElementById('maoObraValor');
  if (moEl) moEl.innerText = maoObra > 0 ? '+ ' + formatCurrency(maoObraReais) : '';

  if (tipoViagem === 'unica') {
    calcularUnica(custoTotal, valorBase, margem, maoObra);
  } else {
    calcularConstante(custoTotal, valorBase, maoObra);
  }

  document.getElementById('wppSection').classList.remove('hidden');
}

function calcularUnica(custoTotal, valorBase, margem, maoObra) {
  const lucro = valorBase - custoTotal;
  const maoObraReais = custoTotal * (maoObra||0);

  document.getElementById('valorUnico').innerText = formatCurrency(valorBase);
  let custoInfo = `Custo da viagem: ${formatCurrency(custoTotal)}`;
  if (maoObraReais > 0) {
    custoInfo += ` · Mão de obra: ${formatCurrency(maoObraReais)} (${Math.round((maoObra||0)*100)}%)`;
  }
  document.getElementById('custoUnico').innerText = custoInfo;

  const lucroEl = document.getElementById('lucroUnico');
  lucroEl.innerText = `💰 Lucro estimado: ${formatCurrency(lucro)}`;
  lucroEl.style.color = lucro>=0 ? '#22c55e' : '#ef4444';

  document.getElementById('resultUnica').classList.remove('hidden');
  document.getElementById('resultConstante').classList.add('hidden');
}

function calcularConstante(custoTotal, valorBase) {
  const max      = Math.max(2, Math.min(30, Number(document.getElementById('maxViagens').value)||5));
  const descPct  = Number(document.getElementById('descontoSlider').value) / 100;

  const tabela = document.getElementById('tabelaConstante');
  tabela.innerHTML = `
    <div class="tabela-header">
      <div>Qtd</div>
      <div>Valor/Viagem</div>
      <div>Desconto</div>
      <div>Total</div>
    </div>
  `;

  for (let i=1; i<=max; i++) {
    // 1ª viagem: sem desconto. A partir da 2ª: desconto acumulativo
    const descAcum  = i===1 ? 0 : (i-1) * descPct;
    const descFinal = Math.min(descAcum, 0.6); // máx 60% de desconto
    const valorViagem = valorBase * (1 - descFinal);
    const totalPacote = valorViagem * i;

    const row = document.createElement('div');
    row.className = 'tabela-row';
    row.innerHTML = `
      <div class="col-qtd">${i}x ${i===1?'🎯':i<=3?'⭐':'🔥'}</div>
      <div class="col-valor">${formatCurrency(valorViagem)}</div>
      <div class="col-desc">${i===1 ? '—' : '-'+Math.round(descFinal*100)+'%'}</div>
      <div class="col-total">${formatCurrency(totalPacote)}</div>
    `;
    tabela.appendChild(row);
  }

  document.getElementById('resultConstante').classList.remove('hidden');
  document.getElementById('resultUnica').classList.add('hidden');
}

// ── Destinatário WhatsApp ──
function setDestinatario(tipo) {
  destinatario = tipo;
  document.getElementById('btnClienteCad').classList.toggle('active', tipo==='cadastrado');
  document.getElementById('btnNumAvulso').classList.toggle('active', tipo==='avulso');
  document.getElementById('wrapClienteCad').classList.toggle('hidden', tipo==='avulso');
  document.getElementById('wrapNumAvulso').classList.toggle('hidden', tipo==='cadastrado');
}

// ── Montar mensagem ──
function montarMensagem() {
  const km      = Number(document.getElementById('kmInput').value);
  const veiculo = getAtivo();
  const custoKm = calcularCustoPorKm(veiculo);
  const custo   = km * custoKm;
  const margem  = Number(document.getElementById('margemSlider').value) / 100;
  const maoObra = Number(document.getElementById('maoObraSlider').value) / 100;
  const valorBase = custo * (1 + margem + maoObra);

  if (tipoViagem === 'unica') {
    return `Olá! Segue o orçamento para sua viagem:\n\n` +
           `📍 Distância: ${km} km\n` +
           `💵 Valor da corrida: ${formatCurrency(valorBase)}\n\n` +
           `Estamos à disposição! Entre em contato para confirmar. 🚗`;
  } else {
    const max     = Math.max(2, Math.min(30, Number(document.getElementById('maxViagens').value)||5));
    const descPct = Number(document.getElementById('descontoSlider').value) / 100;

    let linhas = '';
    for (let i=1; i<=max; i++) {
      const descAcum  = i===1 ? 0 : (i-1)*descPct;
      const descFinal = Math.min(descAcum, 0.6);
      const valorViagem = valorBase*(1-descFinal);
      const totalPacote = valorViagem*i;
      linhas += `  • ${i}x viagem${i>1?'s':''}: ${formatCurrency(valorViagem)}/viagem = ${formatCurrency(totalPacote)} total${i===1?'':` (-${Math.round(descFinal*100)}%)`}\n`;
    }

    return `Olá! Segue o orçamento para viagens frequentes:\n\n` +
           `📍 Distância por viagem: ${km} km\n\n` +
           `📋 Tabela de valores:\n${linhas}\n` +
           `Quanto mais viagens, maior o desconto! 🚗\n` +
           `Entre em contato para confirmar.`;
  }
}

// ── Enviar WhatsApp ──
function enviarWhatsApp() {
  const veiculo = getAtivo();
  const km      = Number(document.getElementById('kmInput').value);

  if (!veiculo)   { showToast('Nenhum veículo configurado','error'); return; }
  if (!km||km<=0) { showToast('Informe o KM a percorrer','info'); return; }

  let tel = '';

  if (destinatario === 'cadastrado') {
    const clienteId = Number(document.getElementById('selectCliente').value);
    if (!clienteId) { showToast('Selecione um cliente','info'); return; }
    const cliente = (vData.clientes||[]).find(c=>c.id===clienteId);
    if (!cliente?.telefone) { showToast('Cliente sem telefone cadastrado','info'); return; }
    tel = cliente.telefone.replace(/\D/g,'');
  } else {
    tel = document.getElementById('numAvulso').value.replace(/\D/g,'');
    if (!tel||tel.length<10) { showToast('Informe um número válido','info'); return; }
  }

  const msg = montarMensagem();
  window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ── Init ──
initBanner();
popularClientes();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>

<!-- Toggle Tema (Sol/Lua) -->
<button id="theme-toggle" title="Alternar tema" onclick="toggleTheme()">🌙</button>

<!-- FAB backdrop -->
<div id="fab-backdrop" onclick="closeFab()"></div>

<!-- FAB Container -->
<div id="fab-container">

  <!-- Opções (aparecem ao abrir) -->
  <div class="fab-options" id="fab-options">

    <div class="fab-option" onclick="window.location.href='cotacao.html'">
      <div class="fab-option-label">Cotação</div>
      <button class="fab-option-btn fab-opt-cotacao">💰</button>
    </div>

    <div class="fab-option" onclick="window.location.href='viagens.html'">
      <div class="fab-option-label">Nova Viagem</div>
      <button class="fab-option-btn fab-opt-viagem">🚕</button>
    </div>

    <div class="fab-option" onclick="window.location.href='entregas.html'">
      <div class="fab-option-label">Nova Entrega</div>
      <button class="fab-option-btn fab-opt-entrega">📦</button>
    </div>

    <div class="fab-option" onclick="window.location.href='abastecimento.html'">
      <div class="fab-option-label">Novo Abastecimento</div>
      <button class="fab-option-btn fab-opt-abastecimento">⛽</button>
    </div>

  </div>

  <!-- Botão principal -->
  <button id="fab-main" onclick="toggleFab()">+</button>

</div>

<script>
  /* ── TEMA ── */
  (function() {
    const saved = localStorage.getItem('kmTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = saved === 'dark' ? '🌙' : '☀️';
  })();

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('kmTheme', next);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = next === 'dark' ? '🌙' : '☀️';
  }

  /* ── FAB ── */
  function toggleFab() {
    const opts     = document.getElementById('fab-options');
    const main     = document.getElementById('fab-main');
    const backdrop = document.getElementById('fab-backdrop');
    const open = opts.classList.toggle('visible');
    main.classList.toggle('open', open);
    backdrop.classList.toggle('visible', open);
  }

  function closeFab() {
    document.getElementById('fab-options').classList.remove('visible');
    document.getElementById('fab-main').classList.remove('open');
    document.getElementById('fab-backdrop').classList.remove('visible');
  }
</script>

</body>
</html>
