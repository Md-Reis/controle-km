<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Ícones -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Controle KM">

<!-- Splash (iOS) -->
<link rel="apple-touch-startup-image" href="assets/logo.webp">

<title>Controle KM</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="assets/logo.webp" alt="Sheyla Toyota">
</div>

<nav>
  <button onclick="showPage('veiculos')" class="active">🚗</button>

  <button onclick="showPage('metas')">🎯</button>
</nav>

<!-- VEÍCULOS -->
<section id="veiculos" class="page active">
  <h2>🚗 Veículos</h2>

  <div class="card">
    <input id="vNome" placeholder="Nome do veículo">
    <input id="vConsumo" type="number" placeholder="KM por litro">
    <button onclick="addVeiculo()">Adicionar veículo</button>
  </div>

  <div id="listaVeiculos"></div>

  <!-- Módulos -->
  <div style="margin-top:24px">
  <h3 style="margin-bottom:12px;opacity:.7;font-size:14px;text-transform:uppercase;letter-spacing:.05em">Módulos</h3>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

    <a href="entregas.html" style="text-decoration:none;color:inherit">
      <div class="veiculo-card" style="text-align:center;padding:24px 16px;cursor:pointer">
        <div style="font-size:36px;margin-bottom:8px">📦</div>
        <div style="font-weight:bold;font-size:15px">Entregas</div>
      </div>
    </a>

    <a href="viagens.html" style="text-decoration:none;color:inherit">
      <div class="veiculo-card" style="text-align:center;padding:24px 16px;cursor:pointer">
        <div style="font-size:36px;margin-bottom:8px">🚕</div>
        <div style="font-weight:bold;font-size:15px">Viagens</div>
      </div>
    </a>

    <a href="cotacao.html" style="text-decoration:none;color:inherit;grid-column:1/-1">
      <div class="veiculo-card" style="text-align:center;padding:20px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px">
        <div style="font-size:32px">💰</div>
        <div style="text-align:left">
          <div style="font-weight:bold;font-size:15px">Cotação de Viagem</div>
          <div style="font-size:12px;opacity:.55;margin-top:2px">Gere orçamentos e envie pelo WhatsApp</div>
        </div>
      </div>
    </a>

  </div>
</div>
</section>


<!-- CUSTOS -->


<!-- METAS TOTAIS -->
<section id="metas" class="page">
  <h2>🎯 Metas Totais</h2>
  <p style="opacity:.6;font-size:14px">Soma de entregas + viagens por mês</p>

  <div class="card">
    <label>Ano</label>
    <select id="metaAnoTotal" onchange="renderMetasTotal()"></select>
  </div>

  <div id="resumoTotal" class="card" style="margin-bottom:14px"></div>

  <div id="gaugesTotal" class="gauges-grid"></div>
</section>


<!-- Modal Editar Veículo -->
<div id="modalVeiculoEdit" class="modal hidden">
  <div class="modal-box" style="max-height:88vh;overflow-y:auto">
    <h2>✏️ Editar Veículo</h2>

    <label>Nome</label>
    <input type="text" id="editNomeVeiculo">

    <label>Consumo (km/l)</label>
    <input type="number" step="0.1" id="editConsumoVeiculo" oninput="atualizarPreviewKm()">

    <label>KM médio mensal</label>
    <input type="number" id="editKmMensal" oninput="atualizarPreviewKm()" placeholder="Ex: 1500">
    <small style="opacity:.6">Usado para diluir custos fixos por km</small>

    <hr style="border:none;border-top:1px solid rgba(255,255,255,.07);margin:14px 0">
    <strong style="font-size:13px;opacity:.6;text-transform:uppercase;letter-spacing:.05em">Custos Mensais</strong>

    <label style="margin-top:10px">⛽ Combustível (R$/mês)</label>
    <input type="number" step="0.01" id="editComb" oninput="atualizarPreviewKm()" placeholder="0,00">

    <label>🔧 Manutenção (R$/mês)</label>
    <input type="number" step="0.01" id="editMan" oninput="atualizarPreviewKm()" placeholder="0,00">

    <label>🛞 Pneus (R$/mês)</label>
    <input type="number" step="0.01" id="editPneu" oninput="atualizarPreviewKm()" placeholder="0,00">

    <label>🛡 Seguro (R$/mês)</label>
    <input type="number" step="0.01" id="editSeg" oninput="atualizarPreviewKm()" placeholder="0,00">

    <label>📦 Outros (R$/mês)</label>
    <input type="number" step="0.01" id="editOut" oninput="atualizarPreviewKm()" placeholder="0,00">

    <div id="previewCustoKm" style="
      background:rgba(124,106,230,.1);border:1px solid rgba(124,106,230,.2);
      border-radius:10px;padding:12px;margin-top:12px;text-align:center;
    ">
      <small style="opacity:.6">Custo estimado por km</small>
      <div id="previewKmVal" style="font-size:22px;font-weight:800;color:var(--primary);margin-top:2px">—</div>
    </div>

    <div class="flex" style="margin-top:14px">
      <button onclick="salvarEdicaoVeiculo()">💾 Salvar</button>
      <button class="danger" onclick="fecharModalVeiculo()">Cancelar</button>
    </div>
  </div>
</div>


<div id="toast" style="
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#020617;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:9999;
  font-weight:500;
"></div>


<script>
  // ======= STORAGE =======
  let data = JSON.parse(localStorage.getItem('kmApp')) || {
    veiculos: [],
    lancamentos: [],
    ativo: null,
    financeiro: { anos: {} },
    draftLancamento: null
  };

  if (!data.financeiro) data.financeiro = { anos: {} };
  if (!data.lancamentos) data.lancamentos = [];

  let veiculoEditandoId = null;

  function save() {
    localStorage.setItem('kmApp', JSON.stringify(data));
  }

  function formatCurrency(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  // ======= PÁGINAS =======
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');

    if (id === 'metas')   { carregarAnosTotalMeta(); renderMetasTotal(); }
  }

  // ======= AUX =======
  function getAtivo() {
    return data.veiculos.find(v => v.id === data.ativo);
  }

  function calcularCustoPorKm(v) {
    if (!v || v.consumo <= 0) return 0;
    const custoComb       = v.custos.comb / v.consumo;
    const custoFixoMensal = (v.custos.man||0) + (v.custos.pneu||0) + (v.custos.seg||0) + (v.custos.out||0);
    const kmMensal        = Number(v.kmMensal) || 900; // usa o km cadastrado, fallback 900
    return custoComb + (kmMensal > 0 ? custoFixoMensal / kmMensal : 0);
  }

  function showToast(msg, type = "success") {
    const toast = document.getElementById("toast");
    const colors = { success: "#22c55e", error: "#ef4444", info: "#38bdf8" };
    toast.innerText = msg;
    toast.style.borderLeft = `6px solid ${colors[type] || colors.success}`;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2500);
  }

  // ======= VEÍCULOS =======
  function addVeiculo() {
    const nome    = vNome.value.trim();
    const consumo = parseFloat(vConsumo.value);
    if (!nome || !consumo) { showToast("Preencha nome e consumo do veículo", "info"); return; }

    data.veiculos.push({ id: Date.now(), nome, consumo, kmMensal: 900, custos: { comb: 0, man: 0, pneu: 0, seg: 0, out: 0 } });
    data.ativo = data.veiculos.at(-1).id;
    vNome.value = '';
    vConsumo.value = '';
    save();
    renderVeiculos();
    showToast("Veículo adicionado e selecionado ✅", "success");
  }


  function renderVeiculos() {
    listaVeiculos.innerHTML = '';
    if (data.veiculos.length === 0) {
      listaVeiculos.innerHTML = "<small>Nenhum veículo cadastrado.</small>";
      return;
    }

    data.veiculos.forEach(v => {
      const ativo = v.id === data.ativo;
      let custoKmCombTxt  = "—";
      let custoKmTotalTxt = "—";

      if (v.consumo > 0) {
        const custoKmComb  = v.custos?.comb > 0 ? v.custos.comb / v.consumo : 0;
        const custoKmTotal = calcularCustoPorKm(v);
        custoKmCombTxt  = `R$ ${custoKmComb.toFixed(2)}`;
        custoKmTotalTxt = `R$ ${custoKmTotal.toFixed(2)}`;
      }

      const card = document.createElement('div');
      card.className = `veiculo-card ${ativo ? 'ativo' : ''}`;
      card.innerHTML = `
        <div class="veiculo-header">
          <span>🚗</span>
          <strong>${v.nome}</strong>
          ${ativo ? '<span class="badge">Ativo</span>' : ''}
        </div>
        <div class="veiculo-body">
          <small>${v.consumo} km/l</small>
          <div class="linha"><span>⛽ Combustível / km</span><strong>${custoKmCombTxt}</strong></div>
          <div class="linha total"><span>🔧 Custo total / km</span><strong>${custoKmTotalTxt}</strong></div>
        </div>
        <div class="veiculo-acoes">
          <button onclick="setAtivo(${v.id})">${ativo ? 'Selecionado ✅' : 'Selecionar'}</button>
          <button onclick="abrirModalVeiculo(${v.id})">✏️ Editar</button>
          <button class="danger" onclick="delVeiculo(${v.id})">🗑️ Excluir</button>
        </div>
      `;
      listaVeiculos.appendChild(card);
    });
  }

  function setAtivo(id) {
    const v = data.veiculos.find(v => v.id === id);
    if (!v) { showToast("Veículo não encontrado", "error"); return; }
    data.ativo = id;
    save();
    renderVeiculos();
    showToast(`Veículo "${v.nome}" selecionado 🚗`, "success");
  }

  function abrirModalVeiculo(id) {
    const v = data.veiculos.find(v => v.id === id);
    if (!v) { showToast("Veículo não encontrado", "error"); return; }
    veiculoEditandoId = id;
    document.getElementById("editNomeVeiculo").value    = v.nome;
    document.getElementById("editConsumoVeiculo").value = v.consumo;
    document.getElementById("editKmMensal").value       = v.kmMensal || 900;
    document.getElementById("editComb").value = v.custos?.comb  || 0;
    document.getElementById("editMan").value  = v.custos?.man   || 0;
    document.getElementById("editPneu").value = v.custos?.pneu  || 0;
    document.getElementById("editSeg").value  = v.custos?.seg   || 0;
    document.getElementById("editOut").value  = v.custos?.out   || 0;
    atualizarPreviewKm();
    document.getElementById("modalVeiculoEdit").classList.remove("hidden");
  }

  function fecharModalVeiculo() {
    document.getElementById("modalVeiculoEdit").classList.add("hidden");
    veiculoEditandoId = null;
  }

  function atualizarPreviewKm() {
    const consumo   = Number(document.getElementById("editConsumoVeiculo").value) || 0;
    const kmMensal  = Number(document.getElementById("editKmMensal").value)       || 900;
    const comb      = Number(document.getElementById("editComb").value) || 0;
    const man       = Number(document.getElementById("editMan").value)  || 0;
    const pneu      = Number(document.getElementById("editPneu").value) || 0;
    const seg       = Number(document.getElementById("editSeg").value)  || 0;
    const out       = Number(document.getElementById("editOut").value)  || 0;

    const el = document.getElementById("previewKmVal");
    if (!el) return;
    if (consumo <= 0 || comb <= 0) { el.innerText = "—"; return; }

    const custoComb  = comb / consumo;
    const fixoMensal = man + pneu + seg + out;
    const total      = custoComb + (kmMensal > 0 ? fixoMensal / kmMensal : 0);
    el.innerText     = `R$ ${total.toFixed(3)} / km`;
  }

  function salvarEdicaoVeiculo() {
    if (veiculoEditandoId === null) { showToast("Nenhum veículo em edição", "error"); return; }
    const v          = data.veiculos.find(v => v.id === veiculoEditandoId);
    const novoNome   = document.getElementById("editNomeVeiculo").value.trim();
    const novoConsumo= Number(document.getElementById("editConsumoVeiculo").value);
    const novoKmMens = Number(document.getElementById("editKmMensal").value) || 900;
    if (!novoNome || !novoConsumo || novoConsumo <= 0) { showToast("Nome ou consumo inválido", "info"); return; }
    v.nome     = novoNome;
    v.consumo  = novoConsumo;
    v.kmMensal = novoKmMens;
    v.custos   = {
      comb: Number(document.getElementById("editComb").value) || 0,
      man:  Number(document.getElementById("editMan").value)  || 0,
      pneu: Number(document.getElementById("editPneu").value) || 0,
      seg:  Number(document.getElementById("editSeg").value)  || 0,
      out:  Number(document.getElementById("editOut").value)  || 0,
    };
    save();
    renderVeiculos();
    fecharModalVeiculo();
    showToast("Veículo atualizado ✅", "success");
  }

  function delVeiculo(id) {
    data.veiculos = data.veiculos.filter(v => v.id !== id);
    if (data.ativo === id) data.ativo = null;
    save();
    renderVeiculos();
    showToast("Veículo excluído com sucesso ❌", "info");
  }

  // ======= CUSTOS =======

  // ======= METAS TOTAIS =======
  function getAnoFinanceiro(ano) {
    if (!data.financeiro.anos[ano]) {
      data.financeiro.anos[ano] = { metas: {}, faturamento: {} };
    }
    return data.financeiro.anos[ano];
  }

  function carregarAnosTotalMeta() {
    const select = document.getElementById("metaAnoTotal");
    if (!select) return;
    const anoAtual = new Date().getFullYear();
    select.innerHTML = "";
    for (let a = anoAtual - 1; a <= anoAtual + 1; a++) {
      const opt = document.createElement("option");
      opt.value = a;
      opt.textContent = a;
      select.appendChild(opt);
    }
    select.value = anoAtual;
  }

  function renderMetasTotal() {
    const ano = Number(document.getElementById("metaAnoTotal").value);

    // Calcula faturamento total (entregas + viagens) por mês
    const fatTotal = new Array(12).fill(0);
    data.lancamentos.forEach(l => {
      const d = new Date(l.data);
      if (d.getFullYear() === ano) {
        fatTotal[d.getMonth()] += Number(l.valor) || 0;
      }
    });

    // Resumo do ano
    const totalAno = fatTotal.reduce((a, b) => a + b, 0);
    const lucroTotal = data.lancamentos
      .filter(l => new Date(l.data).getFullYear() === ano)
      .reduce((acc, l) => acc + (l.lucro || 0), 0);

    document.getElementById("resumoTotal").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <small>💰 Faturamento ${ano}</small>
          <h2 style="margin:4px 0;color:var(--primary)">${formatCurrency(totalAno)}</h2>
        </div>
        <div style="text-align:right">
          <small>📈 Lucro líquido</small>
          <h2 style="margin:4px 0;color:${lucroTotal >= 0 ? 'var(--accent)' : 'var(--danger)'}">${formatCurrency(lucroTotal)}</h2>
        </div>
      </div>
    `;

    // Gauges baseados no faturamento real do mês (sem metas aqui, apenas progresso)
    const SD=210, TD=240, CX=75, CY=75, R=55;
    const circ=2*Math.PI*R, arcLen=(TD/360)*circ;
    function pxy(cx,cy,r,deg){const rad=(deg-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}

    const container = document.getElementById("gaugesTotal");
    container.innerHTML = "";
    const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const maxFat = Math.max(...fatTotal, 1);

    meses.forEach((nomeMes, i) => {
      const fat = fatTotal[i];
      if (fat <= 0) return;

      const perc = Math.min((fat/maxFat)*100, 100);
      const cor  = perc<40 ? "#ff5252" : perc<70 ? "#ffc107" : perc<100 ? "#4ade80" : "#00e676";

      let ticks='';
      for(let t=0;t<=10;t++){
        const deg=SD+(t/10)*TD;
        const inn=pxy(CX,CY,42,deg), out=pxy(CX,CY,50,deg);
        ticks+=`<line class="${t%5===0?'tick-major':'tick'}" x1="${inn.x.toFixed(1)}" y1="${inn.y.toFixed(1)}" x2="${out.x.toFixed(1)}" y2="${out.y.toFixed(1)}"/>`;
      }

      const card = document.createElement('div');
      card.className = 'gauge-card';
      card.innerHTML = `
        <div class="gauge-label">${nomeMes}</div>
        <div class="speedo-wrap">
          <svg class="speedo-svg" width="150" height="95" viewBox="0 0 150 95">
            ${ticks}
            <circle class="speedo-bg" cx="${CX}" cy="${CY}" r="${R}"
              stroke-dasharray="${arcLen} ${circ}" transform="rotate(${SD-90} ${CX} ${CY})"/>
            <circle class="speedo-glow" id="gglow-${ano}-${i}" cx="${CX}" cy="${CY}" r="${R}"
              stroke="${cor}" stroke-dasharray="${arcLen} ${circ}" stroke-dashoffset="${arcLen}"
              transform="rotate(${SD-90} ${CX} ${CY})"/>
            <circle class="speedo-progress" id="gprog-${ano}-${i}" cx="${CX}" cy="${CY}" r="${R}"
              stroke="${cor}" stroke-dasharray="${arcLen} ${circ}" stroke-dashoffset="${arcLen}"
              transform="rotate(${SD-90} ${CX} ${CY})"/>
            <line id="gneedle-${ano}-${i}"
              x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY}"
              stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".95"/>
            <circle cx="${CX}" cy="${CY}" r="4" fill="#1e293b" stroke="white" stroke-width="1.5"/>
            <text x="${CX}" y="60" text-anchor="middle" fill="white"
              font-size="15" font-weight="700" id="gtxt-${ano}-${i}">0%</text>
          </svg>
        </div>
        <div class="gauge-sublabel">${formatCurrency(fat)}</div>
        <div class="gauge-meta-info">${nomeMes} / ${ano}</div>
      `;
      container.appendChild(card);
      setTimeout(()=>{
        animateGauge(`gprog-${ano}-${i}`,`gtxt-${ano}-${i}`,`gglow-${ano}-${i}`,`gneedle-${ano}-${i}`,perc,arcLen);
      },100);
    });

    if (container.innerHTML === "") {
      container.innerHTML = "<small style='opacity:.5'>Nenhum lançamento registrado para este ano.</small>";
    }
  }

  // ======= ANIMATE GAUGE =======
  function animateGauge(progId, textId, glowId, needleId, perc, arcLen) {
    const prog   = document.getElementById(progId);
    const glow   = document.getElementById(glowId);
    const needle = document.getElementById(needleId);
    const text   = document.getElementById(textId);
    if (!prog || !text) return;

    const SD=210, TD=240, CX=75, CY=75, R=55;
    const percVis = Math.min(perc, 100);
    const offset  = arcLen - (percVis/100) * arcLen;
    const cor     = perc<40 ? "#ff5252" : perc<70 ? "#ffc107" : perc<100 ? "#4ade80" : "#00e676";

    prog.style.stroke = cor;
    if (glow) glow.style.stroke = cor;
    prog.style.transition = "none";
    prog.style.strokeDashoffset = arcLen;
    if (glow) { glow.style.transition="none"; glow.style.strokeDashoffset=arcLen; }
    prog.getBoundingClientRect();
    prog.style.transition = "stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)";
    prog.style.strokeDashoffset = offset;
    if (glow) { glow.style.transition="stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)"; glow.style.strokeDashoffset=offset; }

    if (needle) {
      const startTime = performance.now();
      const duration  = 1200;
      function animNeedle(now) {
        const t    = Math.min((now - startTime) / duration, 1);
        const ease = t < 0.5 ? 2*t*t : (4 - 2*t)*t - 1;
        const p    = percVis * ease;
        const deg  = SD + (p / 100) * TD;
        const rad  = (deg - 90) * Math.PI / 180;
        const nx   = (CX + (R - 10) * Math.cos(rad)).toFixed(2);
        const ny   = (CY + (R - 10) * Math.sin(rad)).toFixed(2);
        needle.setAttribute('x2', nx);
        needle.setAttribute('y2', ny);
        if (t < 1) requestAnimationFrame(animNeedle);
      }
      requestAnimationFrame(animNeedle);
    }

    let cur=0; const tgt=Math.round(perc); const step=Math.max(tgt/40,0.5);
    const timer = setInterval(() => {
      cur += step;
      if (cur >= tgt) { cur=tgt; clearInterval(timer); }
      text.textContent = Math.round(cur) + "%";
    }, 25);
  }

  // ======= INIT =======
  renderVeiculos();

  window.addEventListener("load", () => {
    setTimeout(() => {
      const splash = document.getElementById("splash");
      splash.style.opacity = "0";
      setTimeout(() => splash.remove(), 2000);
    }, 1500);
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

<!-- Toggle Tema (Sol/Lua) -->
<button id="theme-toggle" title="Alternar tema" onclick="toggleTheme()">🌙</button>

<!-- FAB backdrop -->
<div id="fab-backdrop" onclick="closeFab()"></div>

<!-- FAB Container -->
<div id="fab-container">

  <!-- Opções (aparecem ao abrir) -->
  <div class="fab-options" id="fab-options">

    <div class="fab-option" onclick="window.location.href='cotacao.html'">
      <div class="fab-option-label">Cotação</div>
      <button class="fab-option-btn fab-opt-cotacao">💰</button>
    </div>

    <div class="fab-option" onclick="window.location.href='viagens.html'">
      <div class="fab-option-label">Nova Viagem</div>
      <button class="fab-option-btn fab-opt-viagem">🚕</button>
    </div>

    <div class="fab-option" onclick="window.location.href='entregas.html'">
      <div class="fab-option-label">Nova Entrega</div>
      <button class="fab-option-btn fab-opt-entrega">📦</button>
    </div>

  </div>

  <!-- Botão principal -->
  <button id="fab-main" onclick="toggleFab()">+</button>

</div>

<script>
  /* ── TEMA ── */
  (function() {
    const saved = localStorage.getItem('kmTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = saved === 'dark' ? '🌙' : '☀️';
  })();

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('kmTheme', next);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = next === 'dark' ? '🌙' : '☀️';
  }

  /* ── FAB ── */
  function toggleFab() {
    const opts     = document.getElementById('fab-options');
    const main     = document.getElementById('fab-main');
    const backdrop = document.getElementById('fab-backdrop');
    const open = opts.classList.toggle('visible');
    main.classList.toggle('open', open);
    backdrop.classList.toggle('visible', open);
  }

  function closeFab() {
    document.getElementById('fab-options').classList.remove('visible');
    document.getElementById('fab-main').classList.remove('open');
    document.getElementById('fab-backdrop').classList.remove('visible');
  }
</script>

</body>
<footer></footer>
</html>
