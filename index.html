<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Ícones -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Controle KM">

<!-- Splash (iOS) -->
<link rel="apple-touch-startup-image" href="assets/logo.webp">

<title>Controle KM</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="assets/logo.webp" alt="Sheyla Toyota">
</div>

<nav>
  <button onclick="showPage('veiculos')" class="active">🚗</button>
  <button onclick="showPage('custos')">⚙️</button>
  <button onclick="showPage('metas')">🎯</button>
</nav>

<!-- VEÍCULOS -->
<section id="veiculos" class="page active">
  <h2>🚗 Veículos</h2>

  <div class="card">
    <input id="vNome" placeholder="Nome do veículo">
    <input id="vConsumo" type="number" placeholder="KM por litro">
    <button onclick="addVeiculo()">Adicionar veículo</button>
  </div>

  <div id="listaVeiculos"></div>

  <!-- Módulos -->
  <div style="margin-top:24px">
  <h3 style="margin-bottom:12px;opacity:.7;font-size:14px;text-transform:uppercase;letter-spacing:.05em">Módulos</h3>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

    <a href="entregas.html" style="text-decoration:none;color:inherit">
      <div class="veiculo-card" style="text-align:center;padding:24px 16px;cursor:pointer">
        <div style="font-size:36px;margin-bottom:8px">📦</div>
        <div style="font-weight:bold;font-size:15px">Entregas</div>
      </div>
    </a>

    <a href="viagens.html" style="text-decoration:none;color:inherit">
      <div class="veiculo-card" style="text-align:center;padding:24px 16px;cursor:pointer;opacity:.55">
        <div style="font-size:36px;margin-bottom:8px">🚕</div>
        <div style="font-weight:bold;font-size:15px">Viagens</div>
      </div>
    </a>

  </div>
</div>
</section>


<!-- CUSTOS -->
<section id="custos" class="page">
  <div class="card-header">
    <h3>⚙️ Custos do Veículo</h3>
    <button class="toggle-view" onclick="toggleCustoView()" title="Alternar visualização">🎚️ / ⌨️</button>
  </div>

  <div class="card" id="resumoCustoKm">
    <strong>🚗 Veículo selecionado:</strong>
    <div id="nomeVeiculoCusto" style="margin-bottom:6px"></div>
    <small>⛽ Custo por KM atual</small>
    <h2 id="custoKmAtual" style="color:var(--secondary);margin:6px 0">—</h2>
  </div>

  <!-- Combustível -->
  <div class="custo-item" data-custo="comb">
    <label>⛽ Combustível (R$)</label>
    <input type="range" id="cComb" min="0" max="15" step="0.1" oninput="updateCusto('comb', this.value)" style="display:none" class="custo-slider">
    <input type="text" class="custo-input money" inputmode="numeric" autocomplete="off">
    <small class="custo-valor" id="vComb">R$ 0,00</small>
  </div>

  <!-- Manutenção -->
  <div class="custo-item" data-custo="man">
    <label>🔧 Manutenção (R$)</label>
    <input type="range" id="cMan" min="0" max="300" step="10" oninput="updateCusto('man', this.value)" style="display:none" class="custo-slider">
    <input type="text" class="custo-input money" inputmode="numeric" autocomplete="off">
    <small class="custo-valor" id="vMan">R$ 0,00</small>
  </div>

  <!-- Pneus -->
  <div class="custo-item" data-custo="pneu">
    <label>🛞 Pneus (R$)</label>
    <input type="range" id="cPneu" min="0" max="200" step="5" oninput="updateCusto('pneu', this.value)" style="display:none" class="custo-slider">
    <input type="text" class="custo-input money" inputmode="numeric" autocomplete="off">
    <small class="custo-valor" id="vPneu">R$ 0,00</small>
  </div>

  <!-- Seguro -->
  <div class="custo-item" data-custo="seg">
    <label>🛡 Seguro (R$)</label>
    <input type="range" id="cSeg" min="0" max="400" step="10" oninput="updateCusto('seg', this.value)" style="display:none" class="custo-slider">
    <input type="text" class="custo-input money" inputmode="numeric" autocomplete="off">
    <small class="custo-valor" id="vSeg">R$ 0,00</small>
  </div>

  <!-- Outros -->
  <div class="custo-item" data-custo="out">
    <label>📦 Outros (R$)</label>
    <input type="range" id="cOut" min="0" max="200" step="10" oninput="updateCusto('out', this.value)" style="display:none" class="custo-slider">
    <input type="text" class="custo-input money" inputmode="numeric" autocomplete="off">
    <small class="custo-valor" id="vOut">R$ 0,00</small>
  </div>

  <div class="card">
    <button onclick="salvarCustos()">💾 Salvar Custos</button>
  </div>
</section>


<!-- METAS TOTAIS -->
<section id="metas" class="page">
  <h2>🎯 Metas Totais</h2>
  <p style="opacity:.6;font-size:14px">Soma de entregas + viagens por mês</p>

  <div class="card">
    <label>Ano</label>
    <select id="metaAnoTotal" onchange="renderMetasTotal()"></select>
  </div>

  <div id="resumoTotal" class="card" style="margin-bottom:14px"></div>

  <div id="gaugesTotal" class="gauges-grid"></div>
</section>


<!-- Modal Editar Veículo -->
<div id="modalVeiculoEdit" class="modal hidden">
  <div class="modal-box">
    <h2>Editar Veículo</h2>
    <label>Nome</label>
    <input type="text" id="editNomeVeiculo">
    <label>Consumo (km/l)</label>
    <input type="number" step="0.1" id="editConsumoVeiculo">
    <div class="flex">
      <button onclick="salvarEdicaoVeiculo()">Salvar</button>
      <button class="danger" onclick="document.getElementById('modalVeiculoEdit').classList.add('hidden')">Cancelar</button>
    </div>
  </div>
</div>


<div id="toast" style="
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#020617;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:9999;
  font-weight:500;
"></div>


<script>
  // ======= STORAGE =======
  let data = JSON.parse(localStorage.getItem('kmApp')) || {
    veiculos: [],
    lancamentos: [],
    ativo: null,
    financeiro: { anos: {} },
    draftLancamento: null
  };

  if (!data.financeiro) data.financeiro = { anos: {} };
  if (!data.lancamentos) data.lancamentos = [];

  let custoView = 'input';
  let veiculoEditandoId = null;

  function save() {
    localStorage.setItem('kmApp', JSON.stringify(data));
  }

  function formatCurrency(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  // ======= PÁGINAS =======
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');

    if (id === 'custos')  { carregarCustos(); atualizarCustoKm(); }
    if (id === 'metas')   { carregarAnosTotalMeta(); renderMetasTotal(); }
  }

  // ======= AUX =======
  function getAtivo() {
    return data.veiculos.find(v => v.id === data.ativo);
  }

  function calcularCustoPorKm(v) {
    if (!v || v.consumo <= 0) return 0;
    const custoComb = v.custos.comb / v.consumo;
    const custoFixoMensal = (v.custos.man || 0) + (v.custos.pneu || 0) + (v.custos.seg || 0) + (v.custos.out || 0);
    const kmMensalEstimado = 30 * 30;
    return custoComb + (kmMensalEstimado > 0 ? custoFixoMensal / kmMensalEstimado : 0);
  }

  function showToast(msg, type = "success") {
    const toast = document.getElementById("toast");
    const colors = { success: "#22c55e", error: "#ef4444", info: "#38bdf8" };
    toast.innerText = msg;
    toast.style.borderLeft = `6px solid ${colors[type] || colors.success}`;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2500);
  }

  // ======= VEÍCULOS =======
  function addVeiculo() {
    const nome    = vNome.value.trim();
    const consumo = parseFloat(vConsumo.value);
    if (!nome || !consumo) { showToast("Preencha nome e consumo do veículo", "info"); return; }

    data.veiculos.push({ id: Date.now(), nome, consumo, custos: { comb: 0, man: 0, pneu: 0, seg: 0, out: 0 } });
    data.ativo = data.veiculos.at(-1).id;
    vNome.value = '';
    vConsumo.value = '';
    save();
    renderVeiculos();
    showToast("Veículo adicionado e selecionado ✅", "success");
  }

  function atualizarCustoKm() {
    const v = getAtivo();
    if (!v) {
      custoKmAtual.innerText = "—";
      nomeVeiculoCusto.innerText = "Nenhum veículo selecionado";
      return;
    }
    nomeVeiculoCusto.innerText = v.nome;
    custoKmAtual.innerText = (v.consumo > 0 && v.custos?.comb > 0)
      ? `R$ ${calcularCustoPorKm(v).toFixed(2)} / km`
      : "—";
  }

  function renderVeiculos() {
    listaVeiculos.innerHTML = '';
    if (data.veiculos.length === 0) {
      listaVeiculos.innerHTML = "<small>Nenhum veículo cadastrado.</small>";
      return;
    }

    data.veiculos.forEach(v => {
      const ativo = v.id === data.ativo;
      let custoKmCombTxt  = "—";
      let custoKmTotalTxt = "—";

      if (v.consumo > 0) {
        const custoKmComb  = v.custos?.comb > 0 ? v.custos.comb / v.consumo : 0;
        const custoKmTotal = calcularCustoPorKm(v);
        custoKmCombTxt  = `R$ ${custoKmComb.toFixed(2)}`;
        custoKmTotalTxt = `R$ ${custoKmTotal.toFixed(2)}`;
      }

      const card = document.createElement('div');
      card.className = `veiculo-card ${ativo ? 'ativo' : ''}`;
      card.innerHTML = `
        <div class="veiculo-header">
          <span>🚗</span>
          <strong>${v.nome}</strong>
          ${ativo ? '<span class="badge">Ativo</span>' : ''}
        </div>
        <div class="veiculo-body">
          <small>${v.consumo} km/l</small>
          <div class="linha"><span>⛽ Combustível / km</span><strong>${custoKmCombTxt}</strong></div>
          <div class="linha total"><span>🔧 Custo total / km</span><strong>${custoKmTotalTxt}</strong></div>
        </div>
        <div class="veiculo-acoes">
          <button onclick="setAtivo(${v.id})">${ativo ? 'Selecionado ✅' : 'Selecionar'}</button>
          <button onclick="abrirModalVeiculo(${v.id})">✏️ Editar</button>
          <button class="danger" onclick="delVeiculo(${v.id})">🗑️ Excluir</button>
        </div>
      `;
      listaVeiculos.appendChild(card);
    });
  }

  function setAtivo(id) {
    const v = data.veiculos.find(v => v.id === id);
    if (!v) { showToast("Veículo não encontrado", "error"); return; }
    data.ativo = id;
    save();
    renderVeiculos();
    carregarCustos();
    atualizarCustoKm();
    showToast(`Veículo "${v.nome}" selecionado 🚗`, "success");
  }

  function abrirModalVeiculo(id) {
    const v = data.veiculos.find(v => v.id === id);
    if (!v) { showToast("Veículo não encontrado", "error"); return; }
    veiculoEditandoId = id;
    document.getElementById("editNomeVeiculo").value    = v.nome;
    document.getElementById("editConsumoVeiculo").value = v.consumo;
    document.getElementById("modalVeiculoEdit").classList.remove("hidden");
  }

  function salvarEdicaoVeiculo() {
    if (veiculoEditandoId === null) { showToast("Nenhum veículo em edição", "error"); return; }
    const v        = data.veiculos.find(v => v.id === veiculoEditandoId);
    const novoNome = document.getElementById("editNomeVeiculo").value.trim();
    const novoConsumo = Number(document.getElementById("editConsumoVeiculo").value);
    if (!novoNome || !novoConsumo || novoConsumo <= 0) { showToast("Nome ou consumo inválido", "info"); return; }
    v.nome    = novoNome;
    v.consumo = novoConsumo;
    save();
    renderVeiculos();
    atualizarCustoKm();
    document.getElementById('modalVeiculoEdit').classList.add("hidden");
    veiculoEditandoId = null;
    showToast("Veículo atualizado 🚗", "success");
  }

  function delVeiculo(id) {
    data.veiculos = data.veiculos.filter(v => v.id !== id);
    if (data.ativo === id) data.ativo = null;
    save();
    renderVeiculos();
    showToast("Veículo excluído com sucesso ❌", "info");
  }

  // ======= CUSTOS =======
  function toggleCustoView() {
    custoView = custoView === 'slider' ? 'input' : 'slider';
    document.querySelectorAll('.custo-item').forEach(item => {
      const slider = item.querySelector('.custo-slider');
      const input  = item.querySelector('.custo-input');
      if (custoView === 'input') {
        input.style.display  = 'block';
        slider.style.display = 'none';
        input.value = slider.value;
      } else {
        slider.style.display = 'block';
        input.style.display  = 'none';
        slider.value = input.value;
      }
    });
    showToast(custoView === 'slider' ? 'Visualização por slider 🎚️' : 'Visualização por entrada ⌨️', 'info');
  }

  function formatMoneyMachine(value) {
    let numbers = value.replace(/\D/g, "");
    if (!numbers) return "0,00";
    return (parseInt(numbers, 10) / 100).toFixed(2).replace(".", ",");
  }

  function parseMoneyToFloat(value) {
    return parseFloat(value.replace(".", "").replace(",", ".")) || 0;
  }

  document.querySelectorAll(".money").forEach(input => {
    input.value = "0,00";
    input.addEventListener("input", function () {
      this.value = formatMoneyMachine(this.value);
      const tipo = this.closest(".custo-item").dataset.custo;
      const valorFloat = parseMoneyToFloat(this.value);
      const v = getAtivo();
      if (!v) return;
      v.custos[tipo] = valorFloat;
      document.getElementById('v' + tipo.charAt(0).toUpperCase() + tipo.slice(1)).innerText = "R$ " + valorFloat.toFixed(2);
      atualizarCustoKm();
      save();
    });
  });

  function updateCusto(tipo, valor) {
    const v = getAtivo();
    if (!v) return;
    valor = Number(valor) || 0;
    v.custos[tipo] = valor;
    document.getElementById('v' + tipo.charAt(0).toUpperCase() + tipo.slice(1)).innerText = "R$ " + valor.toFixed(2);
    document.querySelectorAll(`[data-custo="${tipo}"]`).forEach(item => {
      item.querySelector('.custo-slider').value = valor;
      item.querySelector('.custo-input').value  = formatMoneyMachine((valor * 100).toString());
    });
    atualizarCustoKm();
    renderVeiculos();
    save();
  }

  function salvarCustos() {
    const v = getAtivo();
    if (!v) { showToast("Selecione um veículo primeiro", "error"); return; }
    v.custos = {
      comb: parseMoneyToFloat(document.querySelector('[data-custo="comb"] .custo-input').value),
      man:  parseMoneyToFloat(document.querySelector('[data-custo="man"] .custo-input').value),
      pneu: parseMoneyToFloat(document.querySelector('[data-custo="pneu"] .custo-input').value),
      seg:  parseMoneyToFloat(document.querySelector('[data-custo="seg"] .custo-input').value),
      out:  parseMoneyToFloat(document.querySelector('[data-custo="out"] .custo-input').value)
    };
    atualizarCustoKm();
    renderVeiculos();
    save();
    showToast("Custos atualizados com sucesso ✅", "success");
  }

  function carregarCustos() {
    const v = getAtivo();
    if (!v) return;
    updateCusto('comb', v.custos.comb || 0);
    updateCusto('man',  v.custos.man  || 0);
    updateCusto('pneu', v.custos.pneu || 0);
    updateCusto('seg',  v.custos.seg  || 0);
    updateCusto('out',  v.custos.out  || 0);
  }

  // ======= METAS TOTAIS =======
  function getAnoFinanceiro(ano) {
    if (!data.financeiro.anos[ano]) {
      data.financeiro.anos[ano] = { metas: {}, faturamento: {} };
    }
    return data.financeiro.anos[ano];
  }

  function carregarAnosTotalMeta() {
    const select = document.getElementById("metaAnoTotal");
    if (!select) return;
    const anoAtual = new Date().getFullYear();
    select.innerHTML = "";
    for (let a = anoAtual - 1; a <= anoAtual + 1; a++) {
      const opt = document.createElement("option");
      opt.value = a;
      opt.textContent = a;
      select.appendChild(opt);
    }
    select.value = anoAtual;
  }

  function renderMetasTotal() {
    const ano = Number(document.getElementById("metaAnoTotal").value);

    // Calcula faturamento total (entregas + viagens) por mês
    const fatTotal = new Array(12).fill(0);
    data.lancamentos.forEach(l => {
      const d = new Date(l.data);
      if (d.getFullYear() === ano) {
        fatTotal[d.getMonth()] += Number(l.valor) || 0;
      }
    });

    // Resumo do ano
    const totalAno = fatTotal.reduce((a, b) => a + b, 0);
    const lucroTotal = data.lancamentos
      .filter(l => new Date(l.data).getFullYear() === ano)
      .reduce((acc, l) => acc + (l.lucro || 0), 0);

    document.getElementById("resumoTotal").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <small>💰 Faturamento ${ano}</small>
          <h2 style="margin:4px 0;color:var(--primary)">${formatCurrency(totalAno)}</h2>
        </div>
        <div style="text-align:right">
          <small>📈 Lucro líquido</small>
          <h2 style="margin:4px 0;color:${lucroTotal >= 0 ? 'var(--accent)' : 'var(--danger)'}">${formatCurrency(lucroTotal)}</h2>
        </div>
      </div>
    `;

    // Gauges baseados no faturamento real do mês (sem metas aqui, apenas progresso)
    const container = document.getElementById("gaugesTotal");
    container.innerHTML = "";

    const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const maxFat = Math.max(...fatTotal, 1);

    meses.forEach((nomeMes, i) => {
      const fat = fatTotal[i];
      if (fat <= 0) return;

      const perc = (fat / maxFat) * 100;
      const circumference = 2 * Math.PI * 55;

      const card = document.createElement('div');
      card.className = 'gauge-card';
      card.innerHTML = `
        <div class="gauge-label">${nomeMes}</div>
        <div class="gauge-container">
          <svg class="gauge-svg" width="130" height="130" viewBox="0 0 130 130">
            <circle class="gauge-circle-bg" cx="65" cy="65" r="55"></circle>
            <circle class="gauge-circle-progress" cx="65" cy="65" r="55"
              stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"
              id="gtotal-${ano}-${i}" style="stroke:#7c6ae6"></circle>
          </svg>
          <div class="gauge-text" id="gttext-${ano}-${i}" style="font-size:14px">${formatCurrency(fat).replace('R$','')}</div>
        </div>
        <div class="gauge-sublabel" style="font-size:12px">${nomeMes} / ${ano}</div>
      `;
      container.appendChild(card);

      setTimeout(() => {
        const g = document.getElementById(`gtotal-${ano}-${i}`);
        if (!g) return;
        const offset = circumference - (Math.min(perc, 100) / 100) * circumference;
        g.style.transition = "none";
        g.style.strokeDashoffset = circumference;
        g.getBoundingClientRect();
        g.style.transition = "stroke-dashoffset 1s ease";
        g.style.strokeDashoffset = offset;
      }, 100);
    });

    if (container.innerHTML === "") {
      container.innerHTML = "<small style='opacity:.5'>Nenhum lançamento registrado para este ano.</small>";
    }
  }

  // ======= INIT =======
  renderVeiculos();

  window.addEventListener("load", () => {
    setTimeout(() => {
      const splash = document.getElementById("splash");
      splash.style.opacity = "0";
      setTimeout(() => splash.remove(), 2000);
    }, 1500);
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
<footer></footer>
</html>
